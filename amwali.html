  SAR:{ar:'ر.س',en:'SAR',fr:'SAR'},
  USD:{ar:'$',en:'$',fr:'$'},

  AED:{ar:'د.إ',en:'AED',fr:'AED'},
  EGP:{ar:'ج.م',en:'EGP',fr:'EGP'},
};

const LANGUAGES = [
  { code: 'ar', name: 'العربية', english: 'Arabic', rtl: true },
  { code: 'en', name: 'English', english: 'English', rtl: false },
  { code: 'fr', name: 'Français', english: 'French', rtl: false },
];

const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const fmtNum = (n) => Math.round(n).toLocaleString('en-US');
const fmtDate = (dateStr, lang, t) => {
  const d = new Date(dateStr);
  const now = new Date();
  const yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return t.today;
  if (d.toDateString() === yesterday.toDateString()) return t.yesterday;
  return d.toLocaleDateString(lang === 'ar' ? 'ar-EG' : lang, { day: 'numeric', month: 'short' });
};

// ============== STORAGE (localStorage) ==============
const S = {
  get(k) { try { const v = localStorage.getItem(k); return v ? { value: v } : null; } catch(e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch(e) { return null; } },
  delete(k) { try { localStorage.removeItem(k); return true; } catch(e) { return null; } },
};

// ============== MAIN APP ==============
function App() {
  const [loading, setLoading] = useState(true);
  const [showWelcome, setShowWelcome] = useState(false);
  const [screen, setScreen] = useState('home');
  const [lang, setLang] = useState('ar');
  const [currency, setCurrency] = useState('SAR');
  const [userName, setUserName] = useState('');
  const [transactions, setTransactions] = useState([]);
  const [goals, setGoals] = useState([]);
  const [toggles, setToggles] = useState({ dark: true, notif: true, bio: false, backup: false });

  const t = T[lang];
  const isRTL = LANGUAGES.find(l => l.code === lang)?.rtl;
  const currencySymbol = CURRENCIES[currency][lang] || CURRENCIES[currency].en;

  useEffect(() => {
    const sRes = S.get('amwali:settings');
    if (sRes) {
      try {
        const s = JSON.parse(sRes.value);
        if (s.lang) setLang(s.lang);
        if (s.currency) setCurrency(s.currency);
        if (s.userName) setUserName(s.userName);
        if (s.toggles) setToggles(s.toggles);
        setShowWelcome(!s.onboarded);
      } catch(e) { setShowWelcome(true); }
    } else setShowWelcome(true);

    const txRes = S.get('amwali:transactions');
    if (txRes) { try { setTransactions(JSON.parse(txRes.value)); } catch(e) {} }
    const gRes = S.get('amwali:goals');
    if (gRes) { try { setGoals(JSON.parse(gRes.value)); } catch(e) {} }
    setLoading(false);
  }, []);

  useEffect(() => { if (!loading) S.set('amwali:settings', JSON.stringify({ lang, currency, userName, toggles, onboarded: !showWelcome })); }, [lang, currency, userName, toggles, showWelcome, loading]);
  useEffect(() => { if (!loading) S.set('amwali:transactions', JSON.stringify(transactions)); }, [transactions, loading]);
  useEffect(() => { if (!loading) S.set('amwali:goals', JSON.stringify(goals)); }, [goals, loading]);

  useEffect(() => {
    document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;
  }, [isRTL, lang]);

  const stats = useMemo(() => {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthTx = transactions.filter(tx => new Date(tx.date) >= monthStart);
    const income = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const totalIncome = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const totalExpense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    return { income, expense, balance: totalIncome - totalExpense, monthTx };
  }, [transactions]);

  const addTx = (tx) => setTransactions(prev => [{ ...tx, id: uid(), date: new Date().toISOString() }, ...prev]);
  const deleteTx = (id) => setTransactions(prev => prev.filter(t => t.id !== id));
  const addGoal = (g) => setGoals(prev => [...prev, { ...g, id: uid(), createdAt: new Date().toISOString() }]);
  const updateGoal = (id, u) => setGoals(prev => prev.map(g => g.id === id ? { ...g, ...u } : g));
  const deleteGoal = (id) => setGoals(prev => prev.filter(g => g.id !== id));
  const resetAll = () => {
    S.delete('amwali:transactions'); S.delete('amwali:goals'); S.delete('amwali:settings');
    setTransactions([]); setGoals([]); setUserName(''); setShowWelcome(true);
  };

  if (loading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#0a0b10'}}>
      <div style={{color:'#d6b26a',fontFamily:'Reem Kufi',fontSize:'32px',fontWeight:700}}>أموالي</div>
    </div>
  );

  const common = { t, lang, isRTL, currencySymbol, currency, userName, setUserName };

  return (
    <div dir={isRTL ? 'rtl' : 'ltr'} lang={lang} style={{
      minHeight:'100vh',
      fontFamily: isRTL ? 'Tajawal, system-ui' : 'system-ui, sans-serif',
      background:'radial-gradient(1200px 600px at 85% -10%, rgba(214,178,106,.06), transparent 60%), radial-gradient(900px 500px at 10% 100%, rgba(74,122,94,.04), transparent 55%), #0a0b10',
      color:'#ecead8'
    }}>
      <div className="mx-auto relative" style={{maxWidth:'440px',minHeight:'100vh',background:'linear-gradient(180deg,#11131c,#0a0b10)',boxShadow:'0 0 80px rgba(0,0,0,.5)'}}>
        {showWelcome ? (
          <WelcomeScreen {...common} onComplete={(name, langCode, curr) => { setUserName(name); setLang(langCode); setCurrency(curr); setShowWelcome(false); }} />
        ) : (
          <>
            <div className="pb-24">
              {screen === 'home' && <HomeScreen {...common} stats={stats} transactions={transactions} onNav={setScreen} onDelete={deleteTx} />}
              {screen === 'add' && <AddScreen {...common} onSave={tx => { addTx(tx); setScreen('home'); }} onCancel={() => setScreen('home')} />}
              {screen === 'analytics' && <AnalyticsScreen {...common} transactions={transactions} stats={stats} />}
              {screen === 'goals' && <GoalsScreen {...common} goals={goals} onAdd={addGoal} onUpdate={updateGoal} onDelete={deleteGoal} />}
              {screen === 'settings' && <SettingsScreen {...common} setLang={setLang} setCurrency={setCurrency} toggles={toggles} setToggles={setToggles} onReset={resetAll} />}
            </div>
            <BottomNav t={t} current={screen} onChange={setScreen} />
          </>
        )}
      </div>
    </div>
  );
}

function WelcomeScreen({ onComplete, lang: initialLang }) {

  const [selectedLang, setSelectedLang] = useState(initialLang || 'ar');

  const crtl = LANGUAGES.find(l => l.code === selectedLang)?.rtl;

  return (
    <div dir={crtl ? 'rtl' : 'ltr'} className="min-h-screen p-6 pt-12 flex flex-col" style={{
      background:'radial-gradient(600px 400px at 50% 0%, rgba(214,178,106,.15), transparent 60%), radial-gradient(400px 400px at 50% 100%, rgba(74,122,94,.1), transparent 60%), #11131c',
      fontFamily: crtl ? 'Tajawal, system-ui' : 'system-ui, sans-serif'

      <div className="mx-auto mb-8 mt-12 relative" style={{width:'110px',height:'110px',borderRadius:'30px',background:'linear-gradient(135deg,#d6b26a,#8a6f3d)',display:'grid',placeItems:'center',boxShadow:'0 20px 60px -20px rgba(214,178,106,.6)'}}>
        <span style={{fontFamily:'Reem Kufi',fontSize:'48px',fontWeight:700,color:'#1a1405'}}>أ</span>
        <div className="absolute" style={{inset:'-10px',borderRadius:'36px',border:'1px solid rgba(214,178,106,.3)',animation:'pulse 3s ease-in-out infinite'}}></div>
      </div>
      <h1 className="text-3xl text-center mb-2" style={{fontFamily:'Reem Kufi',fontWeight:600}}>
        {ct.welcome} <span style={{color:'#d6b26a'}}>{ct.appName}</span>
      </h1>
      <p className="text-center mb-10" style={{color:'#8b8a78',fontSize:'14px'}}>{ct.tagline}</p>

      {step === 1 && <>
        <p className="text-xs text-center mb-4 uppercase tracking-widest" style={{color:'#d6b26a',fontWeight:600}}>{ct.chooseLanguage}</p>
        <div className="grid grid-cols-1 gap-2 mb-6">
          {LANGUAGES.map(l => (
            <button key={l.code} onClick={() => setSelectedLang(l.code)} className="flex items-center justify-between p-4 rounded-2xl" style={{
              border: selectedLang === l.code ? '1px solid #d6b26a' : '1px solid rgba(236,234,216,.14)',
              background: selectedLang === l.code ? 'linear-gradient(135deg,rgba(214,178,106,.15),rgba(214,178,106,.05))' : 'rgba(236,234,216,.03)',
              color:'#ecead8'
            }}>
              <div className={crtl?'text-right':'text-left'}>
                <div style={{fontWeight:500,fontSize:'15px'}}>{l.name}</div>
                <div style={{fontSize:'11px',color:'#8b8a78',direction:'ltr'}}>{l.english}</div>
              </div>
              {selectedLang === l.code && <div style={{width:'22px',height:'22px',borderRadius:'50%',background:'#d6b26a',display:'grid',placeItems:'center'}}><Check size={14} color="#1a1405" strokeWidth={3}/></div>}
            </button>
          ))}
        </div>
        <button onClick={() => setStep(2)} className="w-full mt-auto py-4 rounded-2xl font-bold" style={{background:'linear-gradient(135deg,#d6b26a,#8a6f3d)',color:'#1a1405',fontSize:'15px',boxShadow:'0 10px 30px -10px rgba(214,178,106,.6)',fontFamily:'inherit'}}>
          {ct.continue} {crtl ? '←' : '→'}
        </button>
      </>}

      {step === 2 && <>
        <p className="text-xs text-center mb-4 uppercase tracking-widest" style={{color:'#d6b26a',fontWeight:600}}>{ct.yourName}</p>
        <input value={name} onChange={e => setName(e.target.value)} placeholder={ct.yourName} className="w-full p-4 rounded-2xl mb-6 text-center" style={{background:'rgba(236,234,216,.05)',border:'1px solid rgba(236,234,216,.14)',color:'#ecead8',fontSize:'16px',fontFamily:'inherit',outline:'none'}}/>
        <p className="text-xs text-center mb-4 uppercase tracking-widest" style={{color:'#d6b26a',fontWeight:600}}>{ct.currency}</p>
        <div className="grid grid-cols-5 gap-2 mb-6">
          {Object.keys(CURRENCIES).map(code => (
            <button key={code} onClick={() => setCurr(code)} className="py-3 rounded-xl" style={{
              border: curr === code ? '1px solid #d6b26a' : '1px solid rgba(236,234,216,.14)',
              background: curr === code ? 'rgba(214,178,106,.15)' : 'rgba(236,234,216,.03)',
              color: curr === code ? '#d6b26a' : '#ecead8', fontSize:'12px', fontWeight:600
            }}>{code}</button>
          ))}
        </div>
        <button onClick={() => name.trim() && onComplete(name.trim(), selectedLang, curr)} disabled={!name.trim()} className="w-full mt-auto py-4 rounded-2xl font-bold disabled:opacity-40" style={{background:'linear-gradient(135deg,#d6b26a,#8a6f3d)',color:'#1a1405',fontSize:'15px',boxShadow:'0 10px 30px -10px rgba(214,178,106,.6)',fontFamily:'inherit'}}>
          {ct.continue} {crtl ? '←' : '→'}
        </button>
      </>}
      <style>{`@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.5}}`}</style>
    </div>
  );
}

function AnalyticsScreen({ t, lang, currencySymbol, transactions }) {
  const [period, setPeriod] = useState('month');
  const filtered = useMemo(() => {
    const now = new Date(); let start = new Date();
    if (period === 'week') start.setDate(now.getDate() - 7);
    else if (period === 'month') start = new Date(now.getFullYear(), now.getMonth(), 1);
    else start = new Date(now.getFullYear(), 0, 1);
    return transactions.filter(t => new Date(t.date) >= start && t.type === 'expense');
  }, [transactions, period]);

  const catData = useMemo(() => {
    const map = {};
    filtered.forEach(tx => { map[tx.category] = (map[tx.category] || 0) + tx.amount; });
    return Object.entries(map).map(([key, value]) => ({
      name: t[key] || key, key, value, color: CATEGORIES[key]?.color || '#8b8a78'
    })).sort((a, b) => b.value - a.value);
  }, [filtered, t]);

  const total = catData.reduce((s, c) => s + c.value, 0);

  return (
    <div className="pt-10">
      <div className="px-6 mb-5">
        <h2 style={{fontFamily:'Reem Kufi',fontSize:'22px',fontWeight:600,marginBottom:'4px'}}>{t.financialAnalysis}</h2>
        <p style={{color:'#8b8a78',fontSize:'13px'}}>{t.overview}</p>
      </div>
      <div className="mx-5 mb-5 flex gap-1 p-1 rounded-2xl" style={{background:'rgba(236,234,216,.03)'}}>
        {['week','month','year'].map(p => (
          <button key={p} onClick={() => setPeriod(p)} className="flex-1 py-2.5 rounded-xl" style={{
            background: period === p ? 'linear-gradient(135deg,#d6b26a,#8a6f3d)' : 'transparent',
            color: period === p ? '#1a1405' : '#8b8a78',
            fontWeight: period === p ? 700 : 500, fontSize:'12px', fontFamily:'inherit'
          }}>{t[p]}</button>
        ))}
      </div>

      {catData.length === 0 ? (
        <div className="mx-5 p-8 text-center rounded-3xl" style={{background:'linear-gradient(135deg,#1a1d2a,#0e1018)',border:'1px solid rgba(236,234,216,.08)'}}>
          <PieIcon size={40} style={{margin:'0 auto 16px',color:'#8b8a78'}}/>
          <div style={{fontSize:'15px',fontFamily:'Reem Kufi',color:'#ecead8',marginBottom:'6px'}}>{t.noData}</div>
          <div style={{fontSize:'12px',color:'#8b8a78'}}>{t.noDataHint}</div>
        </div>
      ) : (
        <>
          <div className="mx-5 mb-5 p-6 rounded-3xl" style={{background:'linear-gradient(135deg,#1a1d2a,#0e1018)',border:'1px solid rgba(236,234,216,.08)'}}>
            <div style={{height:'200px',position:'relative'}}>
              <ResponsiveContainer>
                <PieChart>
                  <Pie data={catData} dataKey="value" cx="50%" cy="50%" innerRadius={60} outerRadius={85} paddingAngle={3} stroke="none">
                    {catData.map((e, i) => <Cell key={i} fill={e.color}/>)}
                  </Pie>
                </PieChart>
              </ResponsiveContainer>
              <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div style={{fontSize:'10px',color:'#8b8a78',marginBottom:'4px'}}>{t.monthExpenses}</div>
                <div style={{fontFamily:'Reem Kufi',fontSize:'22px',fontWeight:600}}>{fmtNum(total)}</div>
                <div style={{fontSize:'11px',color:'#d6b26a',marginTop:'2px'}}>{currencySymbol}</div>
              </div>
            </div>
            <div className="mt-4 pt-4 space-y-2.5" style={{borderTop:'1px solid rgba(236,234,216,.06)'}}>
              {catData.slice(0, 6).map(c => (
                <div key={c.key} className="flex items-center gap-3">
                  <div style={{width:'10px',height:'10px',borderRadius:'3px',background:c.color,flexShrink:0}}></div>
                  <span className="flex-1" style={{fontSize:'13px'}}>{c.name}</span>
                  <span style={{color:'#8b8a78',fontSize:'12px',fontFamily:'Reem Kufi'}}>{fmtNum(c.value)} · {((c.value/total)*100).toFixed(0)}%</span>
                </div>
              ))}
            </div>
          </div>
          <div className="mx-5 p-5 rounded-3xl flex gap-3" style={{background:'linear-gradient(135deg,rgba(74,122,94,.18),rgba(74,122,94,.05))',border:'1px solid rgba(74,122,94,.3)'}}>
            <div style={{width:'40px',height:'40px',borderRadius:'13px',background:'rgba(111,168,132,.2)',color:'#6fa884',display:'grid',placeItems:'center',flexShrink:0}}><Sparkles size={20}/></div>
            <div>
              <div style={{fontFamily:'Reem Kufi',fontSize:'14px',fontWeight:600,color:'#6fa884',marginBottom:'6px'}}>{t.smartInsight}</div>
              <p style={{fontSize:'12px',color:'#8b8a78',lineHeight:1.7}}>{t.insightMsg}</p>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

  return (

          <Plus size={16}/> {t.addGoal}

      </div>

      {goals.length === 0 ? (
        <div className="mx-5 p-10 text-center rounded-3xl" style={{background:'linear-gradient(135deg,#1a1d2a,#0e1018)',border:'1px solid rgba(236,234,216,.08)'}}>
          <Target size={44} style={{margin:'0 auto 16px',color:'#d6b26a'}}/>

          <div style={{fontSize:'12px',color:'#8b8a78',marginBottom:'20px'}}>{t.noGoalsHint}</div>
          <button onClick={() => setShowForm(true)} style={{padding:'12px 24px',borderRadius:'14px',background:'linear-gradient(135deg,#d6b26a,#8a6f3d)',color:'#1a1405',fontFamily:'inherit',fontWeight:600,fontSize:'13px'}}>{t.addFirstGoal}</button>
        </div>

        <div className="px-5 space-y-3">

                background: i === 0 ? 'radial-gradient(400px 200px at 80% 0%, rgba(214,178,106,.2), transparent 60%), linear-gradient(135deg,#1a1d2a,#0e1018)' : 'linear-gradient(135deg,#1a1d2a,#0e1018)',
                border: i === 0 ? '1px solid rgba(214,178,106,.2)' : '1px solid rgba(236,234,216,.08)'
              }}>

                  <div style={{flex:1}}>
                    {i === 0 && <div style={{display:'inline-block',padding:'3px 10px',borderRadius:'20px',background:'rgba(214,178,106,.15)',color:'#d6b26a',fontSize:'10px',fontWeight:600,marginBottom:'8px'}}>◆ {t.mainGoal}</div>}
                    <div style={{fontFamily:'Reem Kufi',fontSize:'17px',fontWeight:600}}>{g.title}</div>
                  </div>
                  <button onClick={() => setDel(g)} style={{color:'#8b8a78',padding:'6px'}}><Trash2 size={16}/></button>
                </div>
                <div className="flex justify-between mb-2" style={{fontSize:'12px'}}>
                  <span style={{color:'#8b8a78'}}>{t.saved}</span>
                  <span style={{fontFamily:'Reem Kufi',fontWeight:600}}>{fmtNum(g.saved)} / {fmtNum(g.target)} {currencySymbol}</span>
                </div>
                <div style={{height:'8px',borderRadius:'8px',background:'rgba(236,234,216,.06)',overflow:'hidden'}}>
                  <div style={{height:'100%',width: pct + '%',borderRadius:'8px',background: done ? 'linear-gradient(90deg,#4a7a5e,#6fa884)' : 'linear-gradient(90deg,#8a6f3d,#d6b26a,#eccd8a)',boxShadow:'0 0 20px rgba(214,178,106,.4)',transition:'width .6s ease'}}></div>
                </div>
                <div className="flex justify-between mt-4 pt-4" style={{borderTop:'1px solid rgba(236,234,216,.08)',fontSize:'10px',color:'#8b8a78'}}>

          </div>
        </Modal>
      )}
    </div>
  );

      <input value={title} onChange={e => setTitle(e.target.value)} placeholder={t.goalTitle} className="w-full p-3 rounded-xl mb-4" style={{background:'rgba(236,234,216,.05)',border:'1px solid rgba(236,234,216,.14)',color:'#ecead8',fontFamily:'inherit',fontSize:'14px',outline:'none'}}/>
      <div style={{fontSize:'11px',color:'#8b8a78',marginBottom:'6px'}}>{t.targetAmount} ({currencySymbol})</div>
      <input type="number" value={target} onChange={e => setTarget(e.target.value)} placeholder="10000" className="w-full p-3 rounded-xl mb-4" style={{background:'rgba(236,234,216,.05)',border:'1px solid rgba(236,234,216,.14)',color:'#ecead8',fontFamily:'inherit',fontSize:'14px',outline:'none'}}/>
      <div style={{fontSize:'11px',color:'#8b8a78',marginBottom:'6px'}}>{t.savedSoFar} ({currencySymbol})</div>
      <input type="number" value={saved} onChange={e => setSaved(e.target.value)} placeholder="0" className="w-full p-3 rounded-xl mb-6" style={{background:'rgba(236,234,216,.05)',border:'1px solid rgba(236,234,216,.14)',color:'#ecead8',fontFamily:'inherit',fontSize:'14px',outline:'none'}}/>
      <div className="flex gap-3">
        <button onClick={onCancel} className="flex-1 py-3 rounded-xl" style={{background:'rgba(236,234,216,.06)',color:'#ecead8',fontFamily:'inherit'}}>{t.cancel}</button>
        <button onClick={() => { const tg = parseFloat(target); const sv = parseFloat(saved) || 0; if (title.trim() && tg > 0) onSave({ title: title.trim(), target: tg, saved: sv }); }} disabled={!title.trim() || !target} className="flex-1 py-3 rounded-xl disabled:opacity-40" style={{background:'linear-gradient(135deg,#d6b26a,#8a6f3d)',color:'#1a1405',fontFamily:'inherit',fontWeight:700}}>{t.save}</button>
      </div>
    </Modal>
  );
}

function FundModal({ t, currencySymbol, goal, onSave, onCancel }) {
  const [amount, setAmount] = useState('');
  return (
    <Modal onClose={onCancel}>
      <div style={{fontFamily:'Reem Kufi',fontSize:'18px',fontWeight:600,marginBottom:'4px'}}>{t.addToGoal}</div>
      <div style={{fontSize:'13px',color:'#8b8a78',marginBottom:'20px'}}>{goal.title}</div>
      <div className="p-4 rounded-2xl mb-5 text-center" style={{background:'rgba(236,234,216,.03)',border:'1px solid rgba(236,234,216,.08)'}}>
        <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder={t.typeAmount} className="w-full text-center bg-transparent outline-none" style={{fontFamily:'Reem Kufi',fontSize:'32px',fontWeight:600,color:'#ecead8',border:'none'}}/>
        <div style={{color:'#d6b26a',fontSize:'13px',marginTop:'4px'}}>{currencySymbol}</div>
      </div>
      <div className="flex gap-3">
        <button onClick={onCancel} className="flex-1 py-3 rounded-xl" style={{background:'rgba(236,234,216,.06)',color:'#ecead8',fontFamily:'inherit'}}>{t.cancel}</button>
        <button onClick={() => { const a = parseFloat(amount); if (a > 0) onSave(a); }} disabled={!amount || parseFloat(amount) <= 0} className="flex-1 py-3 rounded-xl disabled:opacity-40" style={{background:'linear-gradient(135deg,#d6b26a,#8a6f3d)',color:'#1a1405',fontFamily:'inherit',fontWeight:700}}>{t.save}</button>
      </div>
    </Modal>
  );
}

function SettingsScreen({ t, lang, isRTL, userName, setUserName, currency, setLang, setCurrency, toggles, setToggles, onReset }) {
  const [showLang, setShowLang] = useState(false);
  const [showCurr, setShowCurr] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [editName, setEditName] = useState(false);
  const [tempName, setTempName] = useState(userName);
  const toggle = (k) => setToggles(p => ({ ...p, [k]: !p[k] }));

  return (
    <div className="pt-10">
      <div className="px-6 mb-5"><h2 style={{fontFamily:'Reem Kufi',fontSize:'22px',fontWeight:600}}>{t.settings}</h2></div>

      <div className="mx-5 mb-6 p-5 rounded-3xl flex items-center gap-4" style={{background:'linear-gradient(135deg,#1a1d2a,#0e1018)',border:'1px solid rgba(236,234,216,.08)'}}>
        <div style={{width:'64px',height:'64px',borderRadius:'20px',background:'linear-gradient(135deg,#d6b26a,#8a6f3d)',display:'grid',placeItems:'center',fontFamily:'Reem Kufi',fontSize:'26px',fontWeight:700,color:'#1a1405',boxShadow:'0 8px 20px -8px rgba(214,178,106,.5)'}}>{(userName || 'A')[0].toUpperCase()}</div>
        <div className="flex-1">
          {editName ? (
            <div className="flex gap-2">
              <input value={tempName} onChange={e => setTempName(e.target.value)} className="flex-1 px-3 py-2 rounded-lg" style={{background:'rgba(236,234,216,.05)',border:'1px solid rgba(236,234,216,.14)',color:'#ecead8',fontFamily:'inherit',outline:'none',fontSize:'14px'}}/>
              <button onClick={() => { setUserName(tempName.trim() || userName); setEditName(false); }} style={{padding:'8px',borderRadius:'10px',background:'#d6b26a',color:'#1a1405'}}><Check size={16}/></button>
            </div>
          ) : (
            <>
              <div style={{fontFamily:'Reem Kufi',fontSize:'16px',fontWeight:500}}>{userName || '—'}</div>
              <button onClick={() => { setTempName(userName); setEditName(true); }} style={{fontSize:'11px',color:'#d6b26a',marginTop:'4px'}}>{t.edit}</button>
            </>
          )}
        </div>
      </div>

      <div className="mx-5 mb-4 rounded-2xl overflow-hidden" style={{background:'rgba(236,234,216,.025)',border:'1px solid rgba(236,234,216,.08)'}}>
        <SI icon={Globe} color="#d6b26a" bg="rgba(214,178,106,.1)" title={t.language} subtitle="Language" right={<div style={{color:'#d6b26a',fontSize:'12px'}}>{LANGUAGES.find(l => l.code === lang)?.name} {isRTL ? '←' : '→'}</div>} onClick={() => setShowLang(true)}/>
        <SI icon={DollarSign} color="#6fa884" bg="rgba(111,168,132,.1)" title={t.currency} subtitle="Default currency" right={<div style={{color:'#d6b26a',fontSize:'12px'}}>{currency} {isRTL ? '←' : '→'}</div>} onClick={() => setShowCurr(true)}/>
        <SI icon={Moon} color="#9aabd8" bg="rgba(111,140,200,.1)" title={t.darkMode} subtitle="Dark mode" right={<Toggle on={toggles.dark}/>} onClick={() => toggle('dark')} last/>
      </div>

      <div className="mx-5 mb-4 rounded-2xl overflow-hidden" style={{background:'rgba(236,234,216,.025)',border:'1px solid rgba(236,234,216,.08)'}}>
        <SI icon={Bell} color="#e08074" bg="rgba(184,85,77,.1)" title={t.notifications} right={<Toggle on={toggles.notif}/>} onClick={() => toggle('notif')}/>
        <SI icon={Fingerprint} color="#6fa884" bg="rgba(111,168,132,.1)" title={t.biometric} right={<Toggle on={toggles.bio}/>} onClick={() => toggle('bio')}/>
        <SI icon={Cloud} color="#7ec5d6" bg="rgba(126,197,214,.1)" title={t.backup} right={<Toggle on={toggles.backup}/>} onClick={() => toggle('backup')} last/>
      </div>

      <div className="mx-5 mb-4 rounded-2xl overflow-hidden" style={{background:'rgba(236,234,216,.025)',border:'1px solid rgba(236,234,216,.08)'}}>
        <SI icon={Download} color="#d6b26a" bg="rgba(214,178,106,.1)" title={t.exportData} subtitle="PDF · CSV" right={<div style={{color:'#8b8a78',fontSize:'12px'}}>{isRTL ? '←' : '→'}</div>}/>
        <SI icon={HelpCircle} color="#8b8a78" bg="rgba(139,138,120,.1)" title={t.help} right={<div style={{color:'#8b8a78',fontSize:'12px'}}>{isRTL ? '←' : '→'}</div>} last/>
      </div>

      <div className="mx-5 mb-6">
        <button onClick={() => setConfirmReset(true)} className="w-full py-3 rounded-2xl" style={{background:'rgba(184,85,77,.1)',color:'#e08074',fontFamily:'inherit',fontSize:'13px',fontWeight:500,border:'1px solid rgba(184,85,77,.2)'}}>{t.resetAll}</button>
      </div>

      <div className="text-center pb-4">
        <div style={{fontFamily:'Reem Kufi',fontSize:'14px',color:'#d6b26a'}}>أموالي · Amwali</div>
        <div style={{fontSize:'10px',color:'#8b8a78',marginTop:'4px'}}>v1.0 · 2026</div>
      </div>

      {showLang && (
        <Modal onClose={() => setShowLang(false)}>
          <div style={{fontFamily:'Reem Kufi',fontSize:'18px',fontWeight:600,marginBottom:'16px'}}>{t.language}</div>
          <div className="space-y-2">
            {LANGUAGES.map(l => (
              <button key={l.code} onClick={() => { setLang(l.code); setShowLang(false); }} className="w-full flex justify-between items-center p-3 rounded-xl" style={{background: lang === l.code ? 'rgba(214,178,106,.15)' : 'rgba(236,234,216,.03)',border: lang === l.code ? '1px solid #d6b26a' : '1px solid rgba(236,234,216,.08)',color:'#ecead8'}}>
                <div>
                  <div style={{fontSize:'14px',fontWeight:500}}>{l.name}</div>
                  <div style={{fontSize:'11px',color:'#8b8a78',direction:'ltr'}}>{l.english}</div>
                </div>
                {lang === l.code && <Check size={18} color="#d6b26a"/>}
              </button>
            ))}
          </div>
        </Modal>
      )}

      {showCurr && (
        <Modal onClose={() => setShowCurr(false)}>
          <div style={{fontFamily:'Reem Kufi',fontSize:'18px',fontWeight:600,marginBottom:'16px'}}>{t.currency}</div>
          <div className="grid grid-cols-2 gap-2">
            {Object.keys(CURRENCIES).map(code => (
              <button key={code} onClick={() => { setCurrency(code); setShowCurr(false); }} className="flex justify-between items-center p-3 rounded-xl" style={{background: currency === code ? 'rgba(214,178,106,.15)' : 'rgba(236,234,216,.03)',border: currency === code ? '1px solid #d6b26a' : '1px solid rgba(236,234,216,.08)',color:'#ecead8'}}>
                <span style={{fontSize:'14px',fontWeight:500}}>{code}</span>
                <span style={{color:'#d6b26a'}}>{CURRENCIES[code][lang] || CURRENCIES[code].en}</span>
              </button>
            ))}
          </div>
        </Modal>
      )}

      {confirmReset && (
        <Modal onClose={() => setConfirmReset(false)}>
          <div style={{fontFamily:'Reem Kufi',fontSize:'17px',fontWeight:600,marginBottom:'8px'}}>{t.resetAll}</div>
          <div style={{fontSize:'13px',color:'#8b8a78',marginBottom:'20px'}}>{t.resetConfirm}</div>
          <div className="flex gap-3">
            <button onClick={() => setConfirmReset(false)} className="flex-1 py-3 rounded-xl" style={{background:'rgba(236,234,216,.06)',color:'#ecead8',fontFamily:'inherit'}}>{t.cancel}</button>
            <button onClick={() => { onReset(); setConfirmReset(false); }} className="flex-1 py-3 rounded-xl" style={{background:'#b8554d',color:'#fff',fontFamily:'inherit',fontWeight:600}}>{t.delete}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function SI({ icon: Icon, color, bg, title, subtitle, right, onClick, last }) {
  return (
    <button onClick={onClick} className="w-full flex items-center gap-3 p-4" style={{borderBottom: last ? 'none' : '1px solid rgba(236,234,216,.06)',textAlign: 'start'}}>
      <div style={{width:'38px',height:'38px',borderRadius:'12px',background:bg,color,display:'grid',placeItems:'center',flexShrink:0}}><Icon size={16}/></div>
      <div className="flex-1">
        <div style={{fontSize:'13px',fontWeight:500,color:'#ecead8'}}>{title}</div>
        {subtitle && <div style={{fontSize:'10px',color:'#8b8a78',marginTop:'2px'}}>{subtitle}</div>}
      </div>
      {right}
    </button>
  );
}

function Toggle({ on }) {
  return (
    <div style={{width:'38px',height:'22px',borderRadius:'20px',background: on ? '#d6b26a' : 'rgba(236,234,216,.1)',position:'relative',flexShrink:0,transition:'background .2s'}}>
      <div style={{position:'absolute',top:'2px',left: on ? '18px' : '2px',width:'18px',height:'18px',borderRadius:'50%',background: on ? '#1a1405' : '#8b8a78',transition:'left .2s'}}></div>
    </div>
  );
}

function BottomNav({ t, current, onChange }) {
  const items = [
    { key: 'home', icon: Home, label: t.home },
    { key: 'analytics', icon: PieIcon, label: t.analytics },
    { key: 'add', icon: PlusCircle, label: t.quickAdd, main: true },
    { key: 'goals', icon: Target, label: t.goals },
    { key: 'settings', icon: Settings, label: t.settings },
  ];
  return (
    <nav style={{position:'fixed',bottom:'12px',left:'12px',right:'12px',maxWidth:'416px',margin:'0 auto',background:'rgba(17,19,28,.88)',backdropFilter:'blur(20px)',border:'1px solid rgba(236,234,216,.14)',borderRadius:'24px',display:'flex',justifyContent:'space-around',padding:'8px',zIndex:20}}>
      {items.map(it => {
        const Icon = it.icon; const active = current === it.key;
        if (it.main) return (
          <button key={it.key} onClick={() => onChange(it.key)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'8px'}}>
            <div style={{width:'44px',height:'44px',borderRadius:'14px',background:'linear-gradient(135deg,#d6b26a,#8a6f3d)',color:'#1a1405',display:'grid',placeItems:'center',boxShadow:'0 8px 20px -6px rgba(214,178,106,.6)',marginTop:'-12px',marginBottom:'2px'}}><Icon size={22}/></div>
          </button>
        );
        return (
          <button key={it.key} onClick={() => onChange(it.key)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',padding:'10px 6px',borderRadius:'14px',background: active ? 'rgba(214,178,106,.12)' : 'transparent',color: active ? '#d6b26a' : '#8b8a78',fontSize:'9px',fontFamily:'inherit',transition:'all .2s'}}>
            <Icon size={17}/><span>{it.label}</span>
          </button>
        );
      })}
    </nav>
  );
}

function Modal({ children, onClose }) {
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:50,background:'rgba(10,11,16,.7)',backdropFilter:'blur(8px)',display:'flex',alignItems:'flex-end',justifyContent:'center',animation:'fadeIn .2s'}}>
      <div onClick={e => e.stopPropagation()} style={{width:'100%',maxWidth:'416px',background:'linear-gradient(180deg,#1a1d2a,#11131c)',borderTopLeftRadius:'28px',borderTopRightRadius:'28px',padding:'28px 24px 24px',borderTop:'1px solid rgba(214,178,106,.15)',animation:'slideUp .25s cubic-bezier(.2,.9,.3,1.2)'}}>
        <div style={{width:'36px',height:'4px',background:'rgba(236,234,216,.2)',borderRadius:'4px',margin:'-8px auto 20px'}}></div>
        {children}
      </div>
      <style>{`@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}`}</style>
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
